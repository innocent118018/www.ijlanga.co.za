name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Google reviews integration
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('src/main.jsx'); s=p.read_text()
          if 'IJ-GOOGLE-REVIEWS-INTEGRATION' not in s:
              marker='function CTA('
              reviews=r'''const GOOGLE_REVIEW_URL='https://g.page/r/CfawCvt7xR_1EAE/review';
function Reviews(){const[reviews,setReviews]=useState([]),[loading,setLoading]=useState(true),[error,setError]=useState('');useEffect(()=>{let live=true;(async()=>{try{const base=import.meta.env.VITE_SUPABASE_URL||'';if(!base)throw new Error('Review service is not configured.');const r=await fetch(`${base}/functions/v1/google-reviews`);const d=await r.json();if(!r.ok)throw new Error(d.error||'Google reviews are temporarily unavailable.');if(live)setReviews(Array.isArray(d.reviews)?d.reviews:[])}catch(e){if(live)setError(e.message||'Google reviews are temporarily unavailable.')}finally{if(live)setLoading(false)}})();return()=>{live=false}},[]);const stars=r=>{const n=String(r||'').toUpperCase();const count=n==='FIVE'?5:n==='FOUR'?4:n==='THREE'?3:n==='TWO'?2:n==='ONE'?1:Number(r)||0;return '★'.repeat(Math.max(0,Math.min(5,count)))+'☆'.repeat(Math.max(0,5-count))};return <section id="reviews" className="reviews-section"><div className="section-intro"><span className="eyebrow">GOOGLE REVIEWS</span><h2>What our clients say.</h2><p>Real feedback from our Google Business Profile.</p></div><div className="reviews-actions"><a className="primary" href={GOOGLE_REVIEW_URL} target="_blank" rel="noreferrer">Leave us a Google Review <ArrowRight size={17}/></a><a className="secondary" href={GOOGLE_REVIEW_URL} target="_blank" rel="noreferrer">View on Google</a></div>{loading&&<div className="reviews-status">Loading Google reviews…</div>}{error&&<div className="reviews-status">{error}</div>}{!loading&&!error&&!reviews.length&&<div className="reviews-status">No Google reviews are available to display yet.</div>}<div className="reviews-grid">{reviews.slice(0,6).map(r=><article className="review-card" key={r.id}><div className="review-head"><div className="review-avatar">{r.reviewer?.slice(0,1).toUpperCase()||'G'}</div><div><strong>{r.reviewer}</strong><small>Google review</small></div><span className="review-stars" aria-label={`${r.rating||''} star rating`}>{stars(r.rating)}</span></div>{r.comment&&<p>{r.comment}</p>}<small className="review-source">Google Business Profile</small></article>)}</div></section>}
'''
              if marker not in s: raise SystemExit('CTA marker not found')
              s=s.replace(marker,reviews+marker,1)
              s=s.replace('<Shop onAdd={add}/><CTA','<Shop onAdd={add}/><Reviews/><CTA',1)
              footer='<a href="https://g.page/r/CfawCvt7xR_1EAE/review" target="_blank" rel="noreferrer">Leave a Google Review</a>'
              s=s.replace('<a href="/portal.html">Client Portal</a>','<a href="/portal.html">Client Portal</a>'+footer,1)
              s=s.replace('const GOOGLE_REVIEW_URL=','/* IJ-GOOGLE-REVIEWS-INTEGRATION */\nconst GOOGLE_REVIEW_URL=',1)
              p.write_text(s)
          css=Path('src/styles.css'); c=css.read_text()
          if 'IJ-GOOGLE-REVIEWS-INTEGRATION' not in c:
              c+='''\n/* IJ-GOOGLE-REVIEWS-INTEGRATION */\n.reviews-section{background:#fff;padding:105px 6%;border-top:1px solid var(--line)}\n.reviews-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:-20px auto 38px}\n.reviews-status{max-width:900px;margin:0 auto 28px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#f7f9fb;color:var(--muted);text-align:center;font-size:13px}\n.reviews-grid{max-width:1240px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}\n.review-card{border:1px solid var(--line);border-radius:18px;padding:22px;background:#fff;box-shadow:0 8px 28px rgba(11,34,57,.05)}\n.review-head{display:flex;align-items:center;gap:10px}.review-avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#edf4f8;color:var(--navy);font-weight:850}.review-head strong{display:block;color:var(--navy);font-size:13px}.review-head small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.review-stars{margin-left:auto;color:var(--gold);letter-spacing:1px;font-size:12px}.review-card p{color:#526476;font-size:13px;line-height:1.7;margin:18px 0}.review-source{color:#8a98a5;font-size:10px}\n@media(max-width:900px){.reviews-grid{grid-template-columns:1fr 1fr}}\n@media(max-width:620px){.reviews-grid{grid-template-columns:1fr}.reviews-section{padding:75px 5%}}\n'''
              css.write_text(c)
          subprocess.run(['git','config','user.name','IJ Langa Consulting'],check=True)
          subprocess.run(['git','config','user.email','143867849+innocent118018@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','src/main.jsx','src/styles.css'],check=True)
          try: subprocess.run(['git','commit','-m','Add Google reviews section and review request link'],check=True); subprocess.run(['git','push'],check=True)
          except subprocess.CalledProcessError: pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

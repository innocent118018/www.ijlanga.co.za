name: Brand logo patch
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure logo is visible in header and footer
        shell: bash
        run: |
          set -e
          if ! grep -q 'IJ-LANGA-BRAND-LOGO-PATCH' src/styles.css; then
            cat >> src/styles.css <<'EOF'

/* IJ-LANGA-BRAND-LOGO-PATCH: use the official logo asset in header and footer */
.brand-mark{
  background: #fff !important;
  background-image: url('/logo.svg') !important;
  background-repeat: no-repeat !important;
  background-position: center !important;
  background-size: contain !important;
  border: 0 !important;
  border-radius: 8px !important;
  box-shadow: none !important;
  color: transparent !important;
  font-size: 0 !important;
  overflow: hidden !important;
}
.footer-brand .brand-mark{
  background-color: rgba(255,255,255,.96) !important;
}
.footer-brand .brand{
  align-items: center;
}
@media (max-width: 760px){
  .brand{min-width: 0 !important;}
  .brand-mark{width: 40px !important;height: 40px !important;}
}
EOF
            git config user.name 'IJ Langa Consulting'
            git config user.email '143867849+innocent118018@users.noreply.github.com'
            git add src/styles.css
            git commit -m 'Use IJ Langa logo in header and footer'
            git push
          fi

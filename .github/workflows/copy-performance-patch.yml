name: Tighten website copy and performance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite homepage copy
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/main.jsx')
          s = p.read_text()
          marker = '/* IJ-COPY-PERFORMANCE-PATCH-20260915 */'
          if marker in s:
              raise SystemExit('Copy patch already applied')

          replacements = {
            "['Company registration (Only)','Secretarial Services','R 695.00']": "['Company registration','Secretarial Services','R 695.00']",
            "['Bookkeeping — Monthly bank reconciliation','Accounting Services','R 2 500.00']": "['Monthly bank reconciliation','Accounting Services','R 2 500.00']",
            "['Company Profile for Tenders','Business Consultation','R 1 800.00']": "['Company profile for tenders','Business Consultation','R 1 800.00']",
            "['CSD Registration','Secretarial Services','R 1 265.00']": "['CSD registration','Secretarial Services','R 1 265.00']",
            "['COIDA Registration','Secretarial Services','R 2 500.00']": "['COIDA registration','Secretarial Services','R 2 500.00']",
            "['CIDB Registration','Secretarial Services','R 2 500.00']": "['CIDB registration','Secretarial Services','R 2 500.00']",
            "['Corporate Income Tax Registration','Taxation Services','R 1 950.00']": "['Corporate income tax registration','Taxation Services','R 1 950.00']",
            "['VAT Returns','Taxation Services','R 1 950.00']": "['VAT returns','Taxation Services','R 1 950.00']",
            "['Tender Applications','Business Consultation','R 5 000.00']": "['Tender application support','Business Consultation','R 5 000.00']",
            "<div className=\"topline\"><span>Accounting • Taxation • Compliance • Business Consulting</span><span>Serving South Africa</span></div>": "<div className=\"topline\"><span>Accounting, tax and compliance support</span><span>South Africa</span></div>",
            "<h1>Clarity for your numbers.<br/><em>Confidence for your business.</em></h1>": "<h1>Accounting and tax support for your business.</h1>",
            "<p>Professional accounting, taxation, payroll, compliance and business consulting for South African businesses and individuals.</p>": "<p>Get practical help with bookkeeping, SARS, CIPC, payroll and business compliance.</p>",
            "<div className=\"hero-trust\"><div><CheckCircle2/> SARS & CIPC support</div><div><CheckCircle2/> Business-focused advice</div><div><CheckCircle2/> Professional service</div></div>": "<ul className=\"hero-benefits\"><li>Keep your records organised</li><li>Handle key SARS and CIPC tasks</li><li>Request a quote online</li></ul>",
            "<div><strong>8+</strong><span>Service categories</span></div><div><strong>100+</strong><span>Business solutions</span></div><div><strong>24/7</strong><span>Online service access</span></div><div><strong>ZA</strong><span>South Africa focused</span></div>": "<div><strong>Online</strong><span>Service catalogue</span></div><div><strong>SARS</strong><span>Tax support</span></div><div><strong>CIPC</strong><span>Company support</span></div><div><strong>Portal</strong><span>Client access</span></div>",
            "<span className=\"eyebrow\">ABOUT IJ LANGA</span><h2>A trusted partner behind the paperwork.</h2><p>We help businesses and individuals deal with the financial, tax and compliance work that can become complicated and time-consuming.</p><p>From company registration and SARS services to bookkeeping, payroll, financial statements and business plans, our approach is practical, professional and focused on getting things done correctly.</p><a className=\"text-link\" href=\"#shop\">View our services <ArrowRight size={17}/></a>": "<span className=\"eyebrow\">BOOKKEEPING</span><h2>Know what your numbers say.</h2><p>Keep your business records organised with practical bookkeeping support.</p><ul><li>Monthly bank reconciliation</li><li>Financial records prepared for review</li><li>Clear next steps when records need attention</li></ul><a className=\"text-link\" href=\"#shop\">Choose bookkeeping <ArrowRight size={17}/></a>",
            "<div className=\"about-panel\"><div className=\"quote-mark\">“</div><p>Accounting is more than numbers. It is about giving business owners the information and confidence to make better decisions.</p><div className=\"signature\">IJ Langa Consulting</div></div>": "<div className=\"about-panel\"><div className=\"quote-mark\">✓</div><p>Start with the service you need, add it to your quote and continue through the online flow.</p><div className=\"signature\">Online service catalogue</div></div>",
            "<span className=\"eyebrow\">WHAT WE DO</span><h2>Everything your business needs to stay on track.</h2><p>Professional support across the financial and administrative side of your business.</p>": "<span className=\"eyebrow\">SERVICES</span><h2>Get the business task off your desk.</h2><p>Choose the service that matches the job you need done.</p>",
            "['01','Accounting & Bookkeeping','Keep your records accurate, organised and decision-ready.',ShieldCheck]": "['01','Accounting & Bookkeeping','Monthly bookkeeping and financial record support.',ShieldCheck]",
            "['02','Tax & SARS Services','Registrations, returns, calculations and compliance support.',Calculator]": "['02','Tax & SARS Services','Help with registrations, returns and SARS-related tasks.',Calculator]",
            "['03','Company Secretarial','CIPC, CSD, COIDA, BBBEE and company administration.',Building2]": "['03','Company Secretarial','Company registration, CIPC and related compliance services.',Building2]",
            "['04','Business Consulting','Business plans, tender support, profiles and practical advice.',BriefcaseBusiness]": "['04','Business Consulting','Business plans, profiles and tender application support.',BriefcaseBusiness]",
            "<span className=\"eyebrow\">HOW IT WORKS</span><h2>Simple from enquiry to completion.</h2>": "<span className=\"eyebrow\">HOW TO START</span><h2>Request a quote in four steps.</h2>",
            "['01','Choose','Find the service that matches your needs.']": "['01','Choose','Pick the service you need.']",
            "['02','Request','Add services to your cart and request a quote.']": "['02','Request','Add it to your cart and request a quote.']",
            "['03','Confirm','We review your requirements and confirm the work.']": "['03','Confirm','Review the quote and confirm the work.']",
            "['04','Complete','Track the service through your client portal.']": "['04','Complete','Use the client portal when available for your service.']",
            "<span className=\"eyebrow\">LIVE ONLINE SERVICE SHOP</span><h2>Choose a service. Build your solution.</h2><p>Services are loaded from the IJ Langa service catalogue.</p>": "<span className=\"eyebrow\">SERVICE CATALOGUE</span><h2>Find the service you need.</h2><p>See the available services and prices, then add your selection to a quote.</p>",
            "<span className=\"eyebrow\">GOOGLE REVIEWS</span><h2>What our clients say.</h2><p>Real feedback from our Google Business Profile.</p>": "<span className=\"eyebrow\">GOOGLE REVIEWS</span><h2>See feedback from our clients.</h2><p>Reviews are loaded from the Google Business Profile.</p>",
            "<span className=\"eyebrow\">FIND IJ LANGA CONSULTING</span><h2>Visit our location.</h2><p>Open the official Google Maps location for directions and current place information.</p>": "<span className=\"eyebrow\">LOCATION</span><h2>Find our location.</h2><p>Open Google Maps for directions.</p>",
            "<span className=\"eyebrow\">READY WHEN YOU ARE</span><h2>Let's get your business<br/><em>on the right track.</em></h2><p>Need help choosing a service? Speak to IJ Langa Consulting.</p>": "<span className=\"eyebrow\">NEXT STEP</span><h2>Choose your service.</h2><p>Need help deciding? Contact IJ Langa Consulting before you request a quote.</p>",
            "> Email Us</": "> Email us",
            "> Access Client Portal</": "> Open client portal",
            "> Explore Services": "> Browse services",
            "> Convert to Quote": "> Request a quote",
          }
          for old,new in replacements.items():
              if old not in s:
                  print('WARN missing:', old[:90])
              s=s.replace(old,new)

          s=s.replace(' rel="noreferrer"', ' rel="noopener noreferrer"')
          s=s.replace('—','-').replace('–','-')
          s += '\n' + marker + '\n'
          p.write_text(s)

          # Remove em/en dashes from editable website text files.
          for path in list(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.jsx','.js','.css','.html','.md','.xml','.txt','.json','.yml','.yaml'}:
                  continue
              try:
                  text=path.read_text()
              except UnicodeDecodeError:
                  continue
              cleaned=text.replace('—','-').replace('–','-')
              if cleaned != text:
                  path.write_text(cleaned)
          PY
      - name: Build production bundle
        run: |
          npm install
          npm run build
      - name: Commit copy and performance changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Tighten website copy and accessibility"
          git push

name: Apply SEO main page improvements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch main page
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/main.jsx')
          s = p.read_text()
          marker = '/* IJ-SEO-MAIN-PATCH-20260914 */'
          if marker in s:
              raise SystemExit('SEO main patch already applied')

          s = s.replace(
              'function Brand({light=false}){return <a className={`brand ${light?\'light\':\'\'}`} href="#home"><span className="brand-mark">IJ</span><span><b>IJ LANGA</b><small>CONSULTING</small></span></a>}',
              'function Brand({light=false}){return <a className={`brand ${light?\'light\':\'\'}`} href="#home"><img className="brand-mark" src="/ijlanga-logo.svg" alt="IJ Langa Consulting logo" width="42" height="42"/><span><b>IJ LANGA</b><small>CONSULTING</small></span></a>}'
          )

          s = s.replace(
              '<button className="mobile-toggle" onClick={()=>setMobile(!mobile)}>',
              '<button className="mobile-toggle" aria-label={mobile?\'Close navigation\':\'Open navigation\'} onClick={()=>setMobile(!mobile)}>'
          )
          s = s.replace(
              '<button className="search-btn" onClick={()=>document.getElementById(\'service-search\')?.focus()}>',
              '<button className="search-btn" aria-label="Search services" onClick={()=>document.getElementById(\'service-search\')?.focus()}>'
          )
          s = s.replace(
              '<button className="cart-btn" onClick={onCart}>',
              '<button className="cart-btn" aria-label={`Open cart (${count} items)`} onClick={onCart}>'
          )

          location_component = '''function Location(){const MAP_URL='https://maps.app.goo.gl/pq2arMvg7okF6eb7A';return <section id="location" className="location-section"><div className="location-card"><div><span className="eyebrow">FIND IJ LANGA CONSULTING</span><h2>Visit our location.</h2><p>Open the official Google Maps location for directions and current place information.</p></div><div className="location-actions"><a className="primary" href={MAP_URL} target="_blank" rel="noopener noreferrer"><MapPin size={17}/> Open Google Maps</a><a className="secondary" href="#contact">Contact us <ArrowRight size={17}/></a></div></div></section>}\n'''
          s = s.replace('function CTA({onLogin})', location_component + 'function CTA({onLogin})')

          old_footer = '''function Footer(){return <footer id="contact"><div className="footer-main"><div className="footer-brand"><Brand light/><p>Professional accounting, taxation, compliance and business consulting services for South African businesses and individuals.</p><div className="contact-mini"><span><Mail size={14}/> info@ijlanga.co.za</span><span><Phone size={14}/> South Africa</span><span><MapPin size={14}/> Mpumalanga & beyond</span></div></div><div><h4>Company</h4><a href="#about">About Us</a><a href="#why-us">Why Us</a><a href="#shop">Services</a><a href="#contact">Contact</a></div><div><h4>Popular Services</h4>{['Tax & SARS','Accounting','Company Registration','Payroll','Business Plans'].map(x=><a href="#shop" key={x}>{x}</a>)}</div><div><h4>Client Access</h4><a href="/admin.html">Admin</a><a href="#login">Employer</a><a href="#login">Reseller</a><a href="#login">Employee</a><a href="/portal.html">Client Portal</a><a href="https://g.page/r/CfawCvt7xR_1EAE/review" target="_blank" rel="noreferrer">Leave a Google Review</a></div></div><div className="footer-bottom"><span>© {new Date().getFullYear()} IJ Langa Consulting (Pty) Ltd. All rights reserved.</span><span>Privacy • Terms • POPIA</span></div></footer>}'''
          new_footer = '''function Footer({onLogin}){return <footer id="contact"><div className="footer-main"><div className="footer-brand"><Brand light/><p>Professional accounting, taxation, compliance and business consulting services for South African businesses and individuals.</p><div className="contact-mini"><span><Mail size={14}/> info@ijlanga.co.za</span><span><Phone size={14}/> South Africa</span><span><MapPin size={14}/> Mpumalanga & beyond</span></div></div><div><h2 className="footer-heading">Company</h2><a href="#about">About Us</a><a href="#why-us">Why Us</a><a href="#shop">Services</a><a href="#location">Location</a><a href="#contact">Contact</a></div><div><h2 className="footer-heading">Popular Services</h2>{['Tax & SARS','Accounting','Company Registration','Payroll','Business Plans'].map(x=><a href="#shop" key={x}>{x}</a>)}</div><div><h2 className="footer-heading">Client Access</h2><a href="/admin.html">Admin</a><button type="button" className="footer-link" onClick={onLogin}>Employer</button><button type="button" className="footer-link" onClick={onLogin}>Reseller</button><button type="button" className="footer-link" onClick={onLogin}>Employee</button><a href="/portal.html">Client Portal</a><a href="https://g.page/r/CfawCvt7xR_1EAE/review" target="_blank" rel="noopener noreferrer">Leave a Google Review</a><a className="map-link" href="https://maps.app.goo.gl/pq2arMvg7okF6eb7A" target="_blank" rel="noopener noreferrer">Google Maps location</a></div></div><div className="footer-bottom"><span>© {new Date().getFullYear()} IJ Langa Consulting (Pty) Ltd. All rights reserved.</span><span>Privacy • Terms • POPIA</span></div></footer>}'''
          if old_footer not in s:
              raise SystemExit('Expected footer block not found')
          s = s.replace(old_footer, new_footer)

          s = s.replace('<Shop onAdd={add}/><Reviews/><CTA onLogin={()=>setLogin(true)}/>', '<Shop onAdd={add}/><Reviews/><Location/><CTA onLogin={()=>setLogin(true)}/>')
          s = s.replace('<Footer/>{drawer&&', '<Footer onLogin={()=>setLogin(true)}/>{drawer&&')
          s += '\n' + marker + '\n'
          p.write_text(s)
          PY
      - name: Build site
        run: |
          npm install
          npm run build
      - name: Commit SEO patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Improve homepage SEO, accessibility and internal links"
          git push

<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IJ Langa Admin — Products</title><style>body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#15243a}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1280px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:#b38a32}.top h1{margin:6px 0;font-size:30px}.top p{margin:0;color:#64748b}.actions{display:flex;gap:10px}.btn{border:0;border-radius:10px;padding:11px 16px;background:#b38a32;color:white;font-weight:800}.btn.alt{background:white;color:#334155;border:1px solid #dbe2ea}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 10px 30px #0f172a0a}.bar{display:flex;gap:12px;margin-bottom:16px}.bar input,.bar select,.form input,.form select,.form textarea{border:1px solid #dbe2ea;border-radius:9px;padding:11px;background:white;box-sizing:border-box}.bar input{flex:1}.stats{display:flex;gap:12px;margin:16px 0}.stat{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:15px 22px}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:#64748b}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px 10px;border-bottom:1px solid #edf1f5;font-size:14px}.table th{font-size:11px;text-transform:uppercase;color:#64748b}.table small{display:block;color:#94a3b8;margin-top:4px}.status{display:inline-block;border-radius:99px;padding:5px 9px;background:#fee2e2;color:#991b1b;font-size:11px;font-weight:800}.status.on{background:#dcfce7;color:#166534}.row button{border:0;background:#eef2f7;border-radius:8px;padding:7px;margin-right:5px}.row .danger{color:#b91c1c}.notice{padding:12px;border-radius:10px;background:#ecfdf5;color:#166534;margin-bottom:12px}.error{padding:12px;border-radius:10px;background:#fef2f2;color:#991b1b;margin-bottom:12px}.auth{max-width:440px;margin:80px auto}.auth h1{margin:8px 0 4px}.auth p{color:#64748b}.auth label,.form label{display:block;font-size:12px;font-weight:800;color:#475569;margin:12px 0}.auth input,.form input,.form select,.form textarea{width:100%;margin-top:6px}.modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px}.form{background:white;border-radius:16px;padding:24px;width:min(720px,100%);max-height:90vh;overflow:auto;position:relative}.close{position:absolute;right:16px;top:16px;border:0;background:#eef2f7;border-radius:50%;width:34px;height:34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.wide{grid-column:1/-1}.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:700px){.wrap{padding:18px}.top,.bar{flex-direction:column;align-items:stretch}.stats{overflow:auto}.table{min-width:900px}.panel{overflow:auto}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div id="root"></div><script type="module">
import React,{useEffect,useState}from'https://esm.sh/react@19.1.1';import{createRoot}from'https://esm.sh/react-dom@19.1.1/client';import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://pyhcmceyhrulkwzedwgf.supabase.co','sb_publishable_INoEkMWhNEbysI8f7OLz9w_99Ohyyeg');
const CATS=['Financial Statements: SMMEs','Retainer Fees','Administration','Business Consultation','Secretarial Services','Taxation Services','Payroll Administration','Accounting Services'];const blank={sku:'',slug:'',name:'',category:CATS[0],description:'',price:'',price_label:'',icon:'',is_active:true};const money=n=>`R ${Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2})}`;
function App(){const[s,setS]=useState(null),[profile,setProfile]=useState(null),[items,setItems]=useState([]),[email,setEmail]=useState(''),[password,setPassword]=useState(''),[busy,setBusy]=useState(false),[loading,setLoading]=useState(true),[err,setErr]=useState(''),[notice,setNotice]=useState(''),[q,setQ]=useState(''),[cat,setCat]=useState('All'),[edit,setEdit]=useState(null),[form,setForm]=useState(blank);useEffect(()=>{supabase.auth.getSession().then(async({data})=>{setS(data.session);if(data.session)await load(data.session)});const{data:{subscription}}=supabase.auth.onAuthStateChange(async(_e,session)=>{setS(session);if(session)await load(session);else{setProfile(null);setItems([]);setLoading(false)}});return()=>subscription.unsubscribe()},[]);async function load(session){setLoading(true);const{data:p,error:pe}=await supabase.from('profiles').select('id,email,full_name,role').eq('id',session.user.id).maybeSingle();if(pe||!p||p.role!=='admin'){setProfile(p||null);setErr('Signed in, but this account is not assigned the admin role.');setLoading(false);return}setProfile(p);const{data,error}=await supabase.from('products').select('*').order('category').order('name');if(error)setErr(error.message);else setItems(data||[]);setLoading(false)}async function signIn(e){e.preventDefault();setBusy(true);setErr('');const{data,error}=await supabase.auth.signInWithPassword({email,password});if(error)setErr(error.message);else setS(data.session);setBusy(false)}async function signOut(){await supabase.auth.signOut()}function openNew(){setForm({...blank,sku:`IJL-${String(items.length+1).padStart(3,'0')}`});setEdit('new')}function openEdit(p){setForm({...p,price:String(p.price??'')});setEdit(p.id)}async function save(e){e.preventDefault();setBusy(true);setErr('');const payload={sku:form.sku.trim(),slug:(form.slug||form.name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),name:form.name.trim(),category:form.category,description:form.description||'',price:Number(form.price),price_label:form.price_label||money(form.price),icon:form.icon||'',is_active:!!form.is_active};const r=edit==='new'?await supabase.from('products').insert(payload):await supabase.from('products').update(payload).eq('id',edit);if(r.error)setErr(r.error.message);else{setNotice('Catalogue saved.');setEdit(null);await load(s)}setBusy(false)}async function toggle(p){const{error}=await supabase.from('products').update({is_active:!p.is_active}).eq('id',p.id);if(error)setErr(error.message);else setItems(x=>x.map(i=>i.id===p.id?{...i,is_active:!i.is_active}:i))}async function del(p){if(!confirm('Delete '+p.name+'?'))return;const{error}=await supabase.from('products').delete().eq('id',p.id);if(error)setErr(error.message);else setItems(x=>x.filter(i=>i.id!==p.id))}const filtered=items.filter(p=>(cat==='All'||p.category===cat)&&`${p.name} ${p.sku} ${p.category}`.toLowerCase().includes(q.toLowerCase()));if(!s)return <div className="wrap"><form className="panel auth" onSubmit={signIn}><span className="eyebrow">IJ LANGA CONSULTING</span><h1>Secure Admin Portal</h1><p>Sign in with the administrator account configured in Supabase Auth.</p><label>Email<input type="email" value={email} onChange={e=>setEmail(e.target.value)} required></input></label><label>Password<input type="password" value={password} onChange={e=>setPassword(e.target.value)} required></input></label>{err&&<div className="error">{err}</div>}<button className="btn" disabled={busy}>{busy?'Signing in…':'Sign in'}</button></form></div>;if(!profile||profile.role!=='admin')return <div className="wrap"><div className="panel auth"><span className="eyebrow">ACCESS CONTROL</span><h1>Admin role required</h1><p>{err||'Your account is authenticated but does not have the admin role.'}</p><button className="btn" onClick={signOut}>Sign out</button></div></div>;return <div className="wrap"><div className="top"><div><span className="eyebrow">IJ LANGA CONSULTING</span><h1>Product Catalogue</h1><p>Manage live services, prices and availability.</p></div><div className="actions"><button className="btn alt" onClick={()=>location.href='/'}>Website</button><button className="btn alt" onClick={signOut}>Sign out</button></div></div>{notice&&<div className="notice">{notice}</div>}{err&&<div className="error">{err}</div>}<div className="stats"><div className="stat"><b>{items.length}</b><span>Total services</span></div><div className="stat"><b>{items.filter(x=>x.is_active).length}</b><span>Active</span></div><div className="stat"><b>{items.filter(x=>!x.is_active).length}</b><span>Inactive</span></div></div><div className="panel"><div className="bar"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search SKU, service or category"></input><select value={cat} onChange={e=>setCat(e.target.value)}><option>All</option>{CATS.map(c=><option key={c}>{c}</option>)}</select><button className="btn" onClick={openNew}>+ Add service</button></div>{loading?<p>Loading…</p>:<table className="table"><thead><tr><th>SKU</th><th>Service</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>{filtered.map(p=><tr key={p.id}><td><code>{p.sku}</code></td><td><b>{p.name}</b><small>{p.slug}</small></td><td>{p.category}</td><td>{p.price_label||money(p.price)}</td><td><span className={p.is_active?'status on':'status'}>{p.is_active?'Active':'Inactive'}</span></td><td className="row"><button onClick={()=>openEdit(p)}>Edit</button><button onClick={()=>toggle(p)}>{p.is_active?'Deactivate':'Activate'}</button><button className="danger" onClick={()=>del(p)}>Delete</button></td></tr>)}</tbody></table>}</div>{edit&&<div className="modal"><form className="form" onSubmit={save}><button type="button" className="close" onClick={()=>setEdit(null)}>×</button><span className="eyebrow">{edit==='new'?'NEW SERVICE':'EDIT SERVICE'}</span><h2>{edit==='new'?'Add catalogue service':'Update catalogue service'}</h2><div className="grid"><label>SKU<input value={form.sku} onChange={e=>setForm({...form,sku:e.target.value})} required></input></label><label>Service name<input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} required></input></label><label>Category<select value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>{CATS.map(c=><option key={c}>{c}</option>)}</select></label><label>Price<input type="number" min="0" step="0.01" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} required></input></label><label>Price label<input value={form.price_label} onChange={e=>setForm({...form,price_label:e.target.value})} placeholder="R 1 950.00"></input></label><label>Slug<input value={form.slug} onChange={e=>setForm({...form,slug:e.target.value})}></input></label><label className="wide">Description<textarea rows="4" value={form.description} onChange={e=>setForm({...form,description:e.target.value})}></textarea></label><label className="wide"><input type="checkbox" checked={!!form.is_active} onChange={e=>setForm({...form,is_active:e.target.checked})}/> Visible in online shop</label></div><div className="foot"><button type="button" className="btn alt" onClick={()=>setEdit(null)}>Cancel</button><button className="btn" disabled={busy}>{busy?'Saving…':'Save service'}</button></div></form></div>}</div>}
createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

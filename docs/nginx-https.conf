# IJ Langa Consulting HTTPS enforcement reference for Nginx.
# Apply this on the production server after confirming the certificate paths.
# Google recommends server-side permanent redirects for HTTP -> HTTPS migrations.

server {
    listen 80;
    listen [::]:80;
    server_name ijlanga.co.za www.ijlanga.co.za;
    return 301 https://www.ijlanga.co.za$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ijlanga.co.za;

    ssl_certificate /etc/letsencrypt/live/www.ijlanga.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ijlanga.co.za/privkey.pem;

    return 301 https://www.ijlanga.co.za$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ijlanga.co.za;

    ssl_certificate /etc/letsencrypt/live/www.ijlanga.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ijlanga.co.za/privkey.pem;

    # Keep the existing root/proxy configuration below this point.
    # Add the HSTS header only after HTTPS is confirmed to work correctly.
    add_header Strict-Transport-Security "max-age=31536000" always;
}
